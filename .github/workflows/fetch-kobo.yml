name: Fetch KoboToolbox Data

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from KoboToolbox
        run: |
          curl -sS --fail \
            -H "Authorization: Token ${{ secrets.KOBO_TOKEN }}" \
            "https://kf.kobotoolbox.org/api/v2/assets/${{ secrets.KOBO_UID }}/data/?format=json&limit=30000" \
            -o new.json
          python3 -c "import json; d=json.load(open('new.json')); assert 'results' in d; print(len(d['results']), 'submissions')"
          mv new.json data.json

      - name: Commit and push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto-update: KoboToolbox data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
